name: Build Test and Publish a Testing Release

on:
  workflow_dispatch:
    inputs:
      gelpkg_ref:
        description: "gel-pkg git ref used to build the packages"
        default: "master"
      metapkg_ref:
        description: "metapkg git ref used to build the packages"
        default: "master"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      subdist: "testing"
      publish: true
      gelpkg_ref: ${{ inputs.gelpkg_ref }}
      metapkg_ref: ${{ inputs.metapkg_ref }}
    secrets:
      PACKAGE_UPLOAD_SSH_KEY: ${{ secrets.PACKAGE_UPLOAD_SSH_KEY }}
