name: Tests with reflection validation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - "REFL-*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
        submodules: true

    - name: Build the server
      uses: ./.github/actions/build-server

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
        submodules: true

    - name: Restore the server build
      uses: ./.github/actions/restore-build

    # Run the test

    - name: Test
      env:
        EDGEDB_DEBUG_DELTA_VALIDATE_REFLECTION: 1
      run: |
        edb test -j2 -v
