# Builds, tests, and optionally publishes the portable server packages.
# Called by build.release.yml (stable), build.testing.yml (testing), and
# build.dryrun.yml (no publishing).

name: Build and Test Packages

on:
  workflow_call:
    inputs:
      subdist:
        description: "Package subdistribution: empty for stable, or testing"
        type: string
        default: ""
      publish:
        description: "Publish the packages after all tests pass"
        type: boolean
        default: true
      gelpkg_ref:
        description: "gel-pkg git ref used to build the packages"
        type: string
        default: "master"
      metapkg_ref:
        description: "metapkg git ref used to build the packages"
        type: string
        default: "master"
    secrets:
      PACKAGE_UPLOAD_SSH_KEY:
        required: false

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix: &linux-targets
        include:
          - {target: linux-x86_64, arch: x86_64, libc: "", runs_on: [package-builder, self-hosted, linux, x64]}
          - {target: linux-aarch64, arch: aarch64, libc: "", runs_on: [package-builder, self-hosted, linux, arm64]}
          - {target: linuxmusl-x86_64, arch: x86_64, libc: musl, runs_on: [package-builder, self-hosted, linux, x64]}
          - {target: linuxmusl-aarch64, arch: aarch64, libc: musl, runs_on: [package-builder, self-hosted, linux, arm64]}
    runs-on: ${{ matrix.runs_on }}

    steps:
    # `uses: docker://` cannot take the image name from the matrix, so run the
    # gel-pkg images the way GitHub runs container actions.
    - name: Build
      env:
        IMAGE: ghcr.io/geldata/gelpkg-build-${{ matrix.target }}:latest
        PACKAGE: "edgedbpkg.edgedb:Gel"
        SRC_REF: ${{ github.sha }}
        PKG_REVISION: "<current-date>"
        PKG_SUBDIST: ${{ inputs.subdist }}
        PKG_PLATFORM: linux
        PKG_PLATFORM_VERSION: ${{ matrix.arch }}
        PKG_PLATFORM_LIBC: ${{ matrix.libc }}
        EXTRA_OPTIMIZATIONS: "true"
        BUILD_IS_RELEASE: "true"
        BUILD_GENERIC: "true"
        METAPKG_GIT_CACHE: disabled
        GEL_PKG_REF: ${{ inputs.gelpkg_ref }}
        METAPKG_REF: ${{ inputs.metapkg_ref }}
      run: |
        docker run --rm --pull always \
          -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace \
          -e PACKAGE -e SRC_REF -e PKG_REVISION -e PKG_SUBDIST \
          -e PKG_PLATFORM -e PKG_PLATFORM_VERSION -e PKG_PLATFORM_LIBC \
          -e EXTRA_OPTIMIZATIONS -e BUILD_IS_RELEASE -e BUILD_GENERIC \
          -e METAPKG_GIT_CACHE -e GEL_PKG_REF -e METAPKG_REF \
          "$IMAGE"

    - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874  # v4.4.0
      with:
        name: builds-${{ matrix.target }}
        path: artifacts/${{ matrix.target }}

  build-macos:
    strategy:
      fail-fast: false
      matrix: &macos-targets
        include:
          - target: macos-x86_64
            arch: x86_64
            runs_on: macos-13
            # Run fewer tests on x86_64, since the test runner is very slow.
            test_files: >-
              test_dump*.py test_backend_*.py test_database.py
              test_server_*.py test_edgeql_ddl.py test_session.py
          - {target: macos-aarch64, arch: aarch64, runs_on: macos-14, test_files: ""}
    runs-on: ${{ matrix.runs_on }}

    steps:
    - name: Update Homebrew before installing Rust toolchain
      run: |
        # Homebrew renamed `rustup-init` to `rustup`:
        #   https://github.com/Homebrew/homebrew-core/pull/177840
        # But the GitHub Action runner is not updated with this change yet.
        # This caused the later `brew update` in step `Build` to relink Rust
        # toolchain executables, overwriting the custom toolchain installed by
        # `dsherret/rust-toolchain-file`. So let's just run `brew update` early.
        brew update

    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          rust-toolchain.toml
        sparse-checkout-cone-mode: false

    - name: Install Rust toolchain
      uses: dsherret/rust-toolchain-file@v1

    - uses: actions/checkout@v4
      with:
        repository: edgedb/edgedb-pkg
        ref: master
        path: edgedb-pkg

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        env HOMEBREW_NO_AUTO_UPDATE=1 brew install libmagic

    - name: Install an alias
      # This is probably not strictly needed, but sentencepiece build script reports
      # errors without it.
      run: |
        printf '#!/bin/sh\n\nexec sysctl -n hw.logicalcpu' > /usr/local/bin/nproc
        chmod +x /usr/local/bin/nproc

    - name: Build
      env:
        PACKAGE: "edgedbpkg.edgedb:Gel"
        SRC_REF: ${{ github.sha }}
        BUILD_IS_RELEASE: "true"
        PKG_REVISION: "<current-date>"
        PKG_SUBDIST: ${{ inputs.subdist }}
        PKG_PLATFORM: macos
        PKG_PLATFORM_VERSION: ${{ matrix.arch }}
        PKG_PLATFORM_ARCH: ${{ matrix.arch }}
        EXTRA_OPTIMIZATIONS: "true"
        METAPKG_GIT_CACHE: disabled
        BUILD_GENERIC: "true"
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        GEL_PKG_REF: ${{ inputs.gelpkg_ref }}
        METAPKG_REF: ${{ inputs.metapkg_ref }}
      run: |
        edgedb-pkg/integration/macos/build.sh

    - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874  # v4.4.0
      with:
        name: builds-${{ matrix.target }}
        path: artifacts/${{ matrix.target }}

  test-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix: *linux-targets
    runs-on: ${{ matrix.runs_on }}

    steps:
    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
      with:
        name: builds-${{ matrix.target }}
        path: artifacts/${{ matrix.target }}

    - name: Test
      env:
        IMAGE: ghcr.io/geldata/gelpkg-test-${{ matrix.target }}:latest
        PKG_SUBDIST: ${{ inputs.subdist }}
        PKG_PLATFORM: linux
        PKG_PLATFORM_VERSION: ${{ matrix.arch }}
        PKG_PLATFORM_LIBC: ${{ matrix.libc }}
        # 0 lets the self-hosted runners use all their cores.
        PKG_TEST_JOBS: 0
      run: |
        docker run --rm --pull always \
          -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace \
          -e PKG_SUBDIST -e PKG_PLATFORM -e PKG_PLATFORM_VERSION \
          -e PKG_PLATFORM_LIBC -e PKG_TEST_JOBS \
          "$IMAGE"

  test-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix: *macos-targets
    runs-on: ${{ matrix.runs_on }}

    steps:
    - uses: actions/checkout@v4
      with:
        repository: edgedb/edgedb-pkg
        ref: master
        path: edgedb-pkg

    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
      with:
        name: builds-${{ matrix.target }}
        path: artifacts/${{ matrix.target }}

    - name: Bump shmmax and shmall to avoid test failures
      if: matrix.arch == 'x86_64'
      run: |
        sudo sysctl -w kern.sysv.shmmax=12582912
        sudo sysctl -w kern.sysv.shmall=12582912

    - name: Test
      env:
        PKG_SUBDIST: ${{ inputs.subdist }}
        PKG_PLATFORM: macos
        PKG_PLATFORM_VERSION: ${{ matrix.arch }}
        PKG_TEST_FILES: ${{ matrix.test_files }}
      run: |
        edgedb-pkg/integration/macos/test.sh

  collect:
    needs: [test-linux, test-macos]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All build+tests passed, ready to publish now!'

  publish:
    needs: collect
    if: inputs.publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, platform: linux, arch: x86_64, libc: ""}
          - {target: linux-aarch64, platform: linux, arch: aarch64, libc: ""}
          - {target: linuxmusl-x86_64, platform: linux, arch: x86_64, libc: musl}
          - {target: linuxmusl-aarch64, platform: linux, arch: aarch64, libc: musl}
          - {target: macos-x86_64, platform: macos, arch: x86_64, libc: ""}
          - {target: macos-aarch64, platform: macos, arch: aarch64, libc: ""}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
      with:
        name: builds-${{ matrix.target }}
        path: artifacts/${{ matrix.target }}

    - name: Describe
      uses: edgedb/edgedb-pkg/integration/actions/describe-artifact@master
      with:
        target: ${{ matrix.target }}

    - name: Publish
      uses: docker://ghcr.io/geldata/gelpkg-upload-linux-x86_64:latest
      env:
        PACKAGE_SERVER: sftp://uploader@package-upload.edgedb.net:22/
        PKG_SUBDIST: ${{ inputs.subdist }}
        PKG_PLATFORM: ${{ matrix.platform }}
        PKG_PLATFORM_VERSION: ${{ matrix.arch }}
        PKG_PLATFORM_LIBC: ${{ matrix.libc }}
        PACKAGE_UPLOAD_SSH_KEY: ${{ secrets.PACKAGE_UPLOAD_SSH_KEY }}

  check-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix: *linux-targets
    runs-on: ${{ matrix.runs_on }}

    steps:
    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
      with:
        name: builds-${{ matrix.target }}
        path: artifacts/${{ matrix.target }}

    - name: Describe
      id: describe
      uses: edgedb/edgedb-pkg/integration/actions/describe-artifact@master
      with:
        target: ${{ matrix.target }}

    - name: Test Published
      env:
        IMAGE: ghcr.io/geldata/gelpkg-testpublished-${{ matrix.target }}:latest
        PKG_NAME: ${{ steps.describe.outputs.name }}
        PACKAGE_SERVER: sftp://uploader@package-upload.edgedb.net:22/
        PKG_SUBDIST: ${{ inputs.subdist }}
        PKG_PLATFORM: linux
        PKG_PLATFORM_VERSION: ${{ matrix.arch }}
        PKG_INSTALL_REF: ${{ steps.describe.outputs.install-ref }}
        PKG_VERSION_SLOT: ${{ steps.describe.outputs.version-slot }}
      run: |
        docker run --rm --pull always \
          -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace \
          -e PKG_NAME -e PACKAGE_SERVER -e PKG_SUBDIST -e PKG_PLATFORM \
          -e PKG_PLATFORM_VERSION -e PKG_INSTALL_REF -e PKG_VERSION_SLOT \
          "$IMAGE"
