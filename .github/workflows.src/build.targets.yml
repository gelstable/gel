publications:
    - name: prod
      suffix: ""
      server: sftp://uploader@package-upload.edgedb.net:22/

package:
    name: "edgedbpkg.edgedb:Gel"
    basename: gel-server

targets:
    linux:
        - name: linux-x86_64
          arch: x86_64
          platform: linux
          platform_version: x86_64
          family: generic
          runs_on: [package-builder, self-hosted, linux, x64]
        - name: linux-aarch64
          arch: aarch64
          platform: linux
          platform_version: aarch64
          family: generic
          runs_on: [package-builder, self-hosted, linux, arm64]
        - name: linuxmusl-x86_64
          arch: x86_64
          platform: linux
          platform_version: x86_64
          platform_libc: musl
          family: generic
          runs_on: [package-builder, self-hosted, linux, x64]
        - name: linuxmusl-aarch64
          arch: aarch64
          platform: linux
          platform_version: aarch64
          platform_libc: musl
          family: generic
          runs_on: [package-builder, self-hosted, linux, arm64]

    macos:
        - name: macos-x86_64
          arch: x86_64
          platform: macos
          platform_version: x86_64
          family: generic
          runs_on: [macos-13]
          # Run fewer tests on x86_64, since the test runner is very slow.
          test:
            files: >
              test_dump*.py test_backend_*.py test_database.py
              test_server_*.py test_edgeql_ddl.py test_session.py
        - name: macos-aarch64
          arch: aarch64
          platform: macos
          platform_version: aarch64
          family: generic
          runs_on: [macos-14]
